<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GenUI Sys - Bubble</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="src/styles/bubble-page.css"/>
</head>
<body class="bubble-page">
  <main class="bubble-stage" aria-label="Bubble app cluster demo">
    <section class="bubble-canvas" data-bubble-shell>
      <div class="bubble-anchor">
        <div class="bubble-pan-layer" data-bubble-pan-layer></div>
        <button class="bubble-orb" data-bubble-orb type="button" aria-label="Long press to expand app bubbles">
          <div class="bubble-orb-visual">
            <div class="orb-icon">
              <div class="orb-icon__glow"></div>
            </div>
          </div>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="src/bubble-page.js"></script>
</body>
</html>
