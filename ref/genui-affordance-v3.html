<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Affordance — GenUI v3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:       #0E0E0E;
  --white:    #FFFFFF;
  --ink:      #0E0E0E;
  --mid:      rgba(255,255,255,.38);
  --soft:     rgba(255,255,255,.16);
  --border:   rgba(255,255,255,.09);
  --accent:   #E8E4DC;
  --lime:     #C8E640;
  --mono:     'DM Mono', monospace;
  --sans:     'DM Sans', system-ui, sans-serif;
  --input-h:  60px;
  --panel-w:  400px;
}

html, body {
  height: 100%;
  background: #030303;
  color: var(--white);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Canvas is fixed — centered in the LEFT zone (viewport minus panel), above input */
.canvas {
  position: fixed !important;
  width: 420px;
  height: 420px;
  left: calc((100vw - var(--panel-w) - 420px) / 2);
  top: calc((100vh - var(--input-h) - 420px) / 2);
  z-index: 1;
}

/* grain overlay on outer bg */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  background-size:256px; pointer-events:none; z-index:0;
}

/* Canvas visual styles (position set above) */
.canvas {
  background: var(--bg);
  overflow: hidden;
  border-radius: 24px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08),
    0 0 0 6px rgba(255,255,255,.015),
    0 48px 120px rgba(0,0,0,.9);
}

/* ── Home screen ─────────────────────────── */
.home-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  pointer-events: all;
  gap: 28px;
  padding: 32px 28px 28px;
  transition: opacity .3s ease, transform .3s ease;
}
.home-screen.hidden {
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
}

/* ── AI orb ──────────────────────────────── */
.ai-orb {
  position: relative;
  width: 72px;
  height: 72px;
  flex-shrink: 0;
}
.ai-orb canvas {
  width: 72px;
  height: 72px;
  border-radius: 50%;
}
/* orb outer ring — gradient stroke */
.ai-orb::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  padding: 1px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.55) 0%,
    rgba(255,255,255,0.08) 40%,
    rgba(255,255,255,0.02) 70%,
    rgba(255,255,255,0.06) 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* ── Prompt text ─────────────────────────── */
.home-prompt {
  font-family: var(--sans);
  font-size: 20px;
  font-weight: 300;
  color: rgba(255,255,255,.55);
  letter-spacing: -.01em;
  text-align: center;
}

/* ── Chips row ───────────────────────────── */
.chips-grid {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  width: 100%;
}

/* Chip uses same gradient-stroke style as morph */
.chip-wrap {
  padding: 1px;
  border-radius: 100px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.55) 0%,
    rgba(255,255,255,0.08) 40%,
    rgba(255,255,255,0.02) 70%,
    rgba(255,255,255,0.06) 100%
  );
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  cursor: pointer;
  transition: box-shadow .15s, transform .12s;
}
.chip-wrap:hover  { box-shadow: 0 4px 20px rgba(0,0,0,0.5); transform: translateY(-1px); }
.chip-wrap:active { transform: scale(.98); }
.chip {
  font-family: var(--sans);
  font-size: 20px;
  font-weight: 300;
  color: rgba(255,255,255,.65);
  background: var(--bg);
  border-radius: 100px;
  padding: 10px 20px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color .15s;
  user-select: none;
}
.chip-wrap:hover .chip { color: rgba(255,255,255,.9); }
.chip-icon { font-size: 16px; opacity: .75; }

/* ── Right chat panel — PAGE LEVEL ──────── */
.chat-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: var(--panel-w);
  bottom: var(--input-h);
  border-left: 1px solid rgba(255,255,255,.06);
  background: rgba(255,255,255,.015);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 6px;
  padding: 24px 14px 18px;
  overflow-y: auto;
  z-index: 30;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
}
.chat-panel::-webkit-scrollbar { display:none; }

/* ══════════════════════════════════════════
   MORPHING CONTAINER
══════════════════════════════════════════ */
/* ── Glass container ─────────────────────── */
.morph-wrap {
  position: absolute;
  top: 50%;
  left: 20px;
  right: 20px;
  transform: translateY(-50%);
  z-index: 10;
  padding: 1px;
  border-radius: 29px;
  /* gradient stroke — bright top-left, fades to near-invisible */
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.55) 0%,
    rgba(255,255,255,0.08) 40%,
    rgba(255,255,255,0.02) 70%,
    rgba(255,255,255,0.06) 100%
  );
  /* ambient outer glow — very subtle */
  box-shadow:
    0 8px 32px rgba(0,0,0,0.6),
    0 0 0 0.5px rgba(255,255,255,0.04);
  transition:
    border-radius .48s cubic-bezier(.4,0,.2,1),
    min-height    .48s cubic-bezier(.4,0,.2,1);
  will-change: border-radius;
}



.morph {
  background: var(--bg);
  overflow: hidden;
  position: relative;
  width: 100%;
  transition:
    border-radius .48s cubic-bezier(.4,0,.2,1),
    min-height    .48s cubic-bezier(.4,0,.2,1);
  will-change: border-radius, min-height;
}
.morph.pill  { border-radius:100px; min-height:64px; }
.morph.card  { border-radius:20px;  min-height:148px; }
.morph.panel { border-radius:18px;  min-height:228px; }
.morph.sheet { border-radius:16px;  min-height:318px; }

/* Wrap border-radius tracks inner */
.morph-wrap:has(.morph.pill)  { border-radius:101px; }
.morph-wrap:has(.morph.card)  { border-radius:21px;  }
.morph-wrap:has(.morph.panel) { border-radius:19px;  }
.morph-wrap:has(.morph.sheet) { border-radius:17px;  }

/* Pill: same glass treatment, just tall enough for content */
.morph-wrap:has(.morph.pill) {
  box-shadow:
    0 8px 32px rgba(0,0,0,0.55),
    0 0 0 0.5px rgba(255,255,255,0.04);
}

/* themes — single dark glass, lm gets a faint tint */
.morph.lt { background: var(--bg); }
.morph.dk { background: rgba(14,14,14,0.88); }
.morph.lm { background: rgba(18,28,4,0.88); }

.morph-inner { animation: ci .22s ease both; }
@keyframes ci { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

/* ── Inner layouts ───────────────────────── */
.p-pill  { display:flex; align-items:center; min-height:64px; padding:0 22px; gap:14px; }
.p-card  { padding:18px 16px 14px; display:flex; flex-direction:column; gap:12px; }
.p-panel { padding:16px 16px 12px; display:flex; flex-direction:column; gap:10px; }

.lbl     { font-family:var(--mono); font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:rgba(255,255,255,.35); }
.lbl.lt  { color:rgba(255,255,255,.30); }

/* ── Option list ─────────────────────────── */
.opt-list { display:flex; flex-direction:column; gap:5px; }
.opt {
  display:flex; align-items:center; gap:9px;
  padding:9px 11px; border-radius:11px;
  background:rgba(255,255,255,.07); border:1.5px solid transparent;
  transition:background .12s, border-color .12s; cursor:default;
}
.opt.focused         { background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.22); }
.opt.dk-opt          { background:rgba(255,255,255,.07); }
.opt.dk-opt.focused  { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.22); }
.opt-icon  { font-size:20px; flex-shrink:0; }
.opt-body  { flex:1; min-width:0; }
.opt-name  { font-size:20px; font-weight:500; color:rgba(255,255,255,.9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.opt-sub   { font-size:15px; color:rgba(255,255,255,.4); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dk-opt .opt-name { color:rgba(255,255,255,.88); }
.dk-opt .opt-sub  { color:rgba(255,255,255,.34); }
.opt-indicator {
  font-family:var(--mono); font-size:8px; color:rgba(255,255,255,.28);
  border:1px solid rgba(255,255,255,.15); border-radius:4px;
  padding:2px 5px; opacity:0; transition:opacity .14s; flex-shrink:0;
}
.opt.focused .opt-indicator { opacity:1; }
.dk-opt .opt-indicator { color:rgba(255,255,255,.28); border-color:rgba(255,255,255,.13); }

/* ── Date display ────────────────────────── */
.date-pair { display:flex; gap:6px; }
.date-chip {
  flex:1; padding:10px 12px; border-radius:12px;
  background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.0);
  transition:all .22s;
}
.date-chip.filled { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2); }
.date-chip .dc-lbl { font-family:var(--mono); font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:2px; }
.date-chip .dc-val { font-size:20px; font-weight:500; color:rgba(255,255,255,.9); }
.date-chip .dc-val.empty { color:rgba(255,255,255,.28); font-weight:300; font-size:20px; }
@keyframes dateFlash {
  0%  { background:rgba(200,230,64,.3); border-color:rgba(200,230,64,.6); }
  100%{ background:rgba(255,255,255,.1);   border-color:rgba(255,255,255,.2); }
}
.date-chip.just-filled { animation:dateFlash .7s ease forwards; }

/* ── Confirm rows ────────────────────────── */
.conf-rows { display:flex; flex-direction:column; }
.conf-row  { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); }
.conf-row:last-child { border-bottom:none; }
.conf-key  { font-size:16px; font-weight:300; color:rgba(255,255,255,.4); }
.conf-val  { font-size:20px; font-weight:500; color:rgba(255,255,255,.9); text-align:right; }

/* ── CTA ─────────────────────────────────── */
.cta {
  width:100%; padding:12px; border-radius:12px;
  background:rgba(255,255,255,.15); color:rgba(255,255,255,.9); border:1px solid rgba(255,255,255,.2);
  font-family:var(--sans); font-size:20px; font-weight:500;
  cursor:pointer; transition:opacity .14s;
}
.cta:hover { opacity:.8; }
.cta.lm { background:rgba(200,230,64,.25); border-color:rgba(200,230,64,.4); color:rgba(255,255,255,.9); }
.cta-hint { font-family:var(--mono); font-size:9px; color:rgba(255,255,255,.22); text-align:center; letter-spacing:.06em; }
.cta-hint.lt { color:rgba(255,255,255,.20); }

/* ── Success ─────────────────────────────── */
.success { padding:24px 18px; display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; }
.s-icon  { font-size:30px; }
.s-title { font-size:22px; font-weight:500; color:rgba(255,255,255,.9); }
.s-sub   { font-size:20px; font-weight:300; color:rgba(255,255,255,.45); line-height:1.45; }

/* ── Chat bubbles ────────────────────────── */
.bubble {
  font-size:20px; line-height:1.35; font-weight:300;
  padding:7px 10px; border-radius:10px;
  animation:bubbleIn .18s ease both;
  word-break:break-word;
}
@keyframes bubbleIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
.bubble.user {
  align-self:flex-end;
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.88);
  border-radius:10px 10px 3px 10px;
}
.bubble.ai {
  align-self:flex-start;
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.07);
  border-radius:3px 10px 10px 10px;
}
.bubble.typing {
  display:flex; align-items:center; gap:5px;
  padding:10px 12px;
}
.typing-dot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(255,255,255,.4);
  animation:typingBounce .9s ease infinite; flex-shrink:0;
}
.typing-dot:nth-child(2){ animation-delay:.15s; }
.typing-dot:nth-child(3){ animation-delay:.30s; }
@keyframes typingBounce{
  0%,60%,100%{ transform:translateY(0); opacity:.35; }
  30%{ transform:translateY(-4px); opacity:1; }
}

/* ── Chat input — PAGE LEVEL ────────────── */
.chat-box {
  position: fixed;
  bottom: 0; left: 0;
  right: var(--panel-w);
  height: var(--input-h);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
  z-index: 30;
}
.chat-box-inner {
  width: 100%;
  max-width: 460px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 100px;
  padding: 0 14px 0 22px;
  display: flex; align-items: center; gap: 10px;
  height: 46px;
  transition: background .15s, border-color .15s;
  backdrop-filter: blur(16px);
}
.chat-box-inner:focus-within {
  background: rgba(255,255,255,.09);
  border-color: rgba(255,255,255,.18);
}
.chat-inp {
  flex:1; background:none; border:none; outline:none;
  font-family:var(--sans); font-size:20px;
  color:var(--white); caret-color:rgba(255,255,255,.7);
}
.chat-inp::placeholder { color:rgba(255,255,255,.2); }
.chat-send {
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.09); border:none;
  color:rgba(255,255,255,.5); font-size:14px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .14s; flex-shrink:0;
}
.chat-send.ready { background:var(--white); color:var(--ink); }
.chat-send:hover { opacity:.8; }
</style>
</head>
<body>

<!-- Right chat panel — page level -->
<div class="chat-panel" id="chatPanel"></div>

<!-- 420×420 monocular glasses canvas — morph UI only -->
<div class="canvas">

  <!-- Home screen -->
  <div class="home-screen" id="homeScreen">

    <!-- AI orb -->
    <div class="ai-orb">
      <canvas id="orbCanvas" width="144" height="144"></canvas>
    </div>

    <!-- Prompt -->
    <div class="home-prompt">What would you like to do?</div>

    <!-- Quick action chips -->
    <div class="chips-grid">
      <div class="chip-wrap" onclick="startFromChip('flight','Book a flight to Tokyo')">
        <div class="chip"><span class="chip-icon">✈</span> Book a flight</div>
      </div>
      <div class="chip-wrap" onclick="startFromChip('message','Send a message to Alice')">
        <div class="chip"><span class="chip-icon">✉</span> Send a message</div>
      </div>
      <div class="chip-wrap" onclick="startFromChip('grocery','Order groceries')">
        <div class="chip"><span class="chip-icon">🛒</span> Order groceries</div>
      </div>
    </div>

  </div>

  <!-- Morphing container — gradient stroke wrapper + glass inner -->
  <div class="morph-wrap" id="mcWrap">
    <div class="morph pill lt" id="mc">
      <div id="mcInner"></div>
    </div>
  </div>

</div>

<!-- Chat input — page level, bottom -->
<div class="chat-box">
  <div class="chat-box-inner">
    <input
      class="chat-inp" id="chatInp"
      placeholder="Type anything…"
      autocomplete="off"
      spellcheck="false"
    >
    <button class="chat-send" id="chatSend" onclick="handleChat()">↑</button>
  </div>
</div>


<script>
// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let flow      = 'flight';
let step      = 0;
let focused   = 0;     // focused option index
let data      = {};    // collected data
let isAnimating = false;

// ══════════════════════════════════════════════
// FLOW DEFINITIONS
// Each step: { shape, theme, type, ...stepData }
// type: 'idle' | 'options' | 'dates' | 'confirm' | 'done'
// ══════════════════════════════════════════════
const FLOWS = {

  flight: [
    {
      shape:'pill', theme:'lt', type:'idle',
      icon:'✈', placeholder:'Where are you flying?',
      aiGreet: "Where would you like to go?"
    },
    {
      shape:'card', theme:'lt', type:'dates',
      label:'When are you flying?',
      fields:{ depart:null, return:null },
      aiGreet: "When are you departing, and when do you return?"
    },
    {
      shape:'panel', theme:'lt', type:'options',
      label:'Passengers',
      opts:[
        {icon:'🧑',name:'1 adult',sub:'Just me'},
        {icon:'👫',name:'2 adults',sub:'Pair'},
        {icon:'👨‍👩‍👧',name:'Family · 2+',sub:'Adults with children'},
      ],
      aiGreet:"How many passengers?"
    },
    {
      shape:'panel', theme:'dk', type:'options',
      label:'Choose your flight',
      opts:[
        {icon:'🟢',name:'06:45 → 09:30',sub:'ANA · Non-stop · $842'},
        {icon:'🟡',name:'10:15 → 15:40',sub:'JAL · 1 stop · $631'},
        {icon:'🟢',name:'22:00 → 06:15+1',sub:'United · Non-stop · $912'},
      ],
      aiGreet:"I found three options — arrow keys to navigate, space to pick."
    },
    {
      shape:'panel', theme:'lt', type:'confirm',
      label:'Booking summary',
      aiGreet:"Here's your summary. Space to confirm or tell me what to change."
    },
    {
      shape:'card', theme:'lm', type:'done',
      aiGreet:null
    },
  ],

  message: [
    {
      shape:'pill', theme:'lt', type:'idle',
      icon:'✉', placeholder:'Who are you messaging?',
      aiGreet:"Who would you like to message?"
    },
    {
      shape:'card', theme:'lt', type:'options',
      label:'Which Alice?',
      opts:[
        {icon:'👩‍💼',name:'Alice Chen',sub:'Design team · 2d ago'},
        {icon:'👩‍🔬',name:'Alice Morgan',sub:'Research · alice.m@studio.co'},
        {icon:'👩‍🎨',name:'Alice Park',sub:'External · Freelance'},
      ],
      aiGreet:"I found three Alices — which one?"
    },
    {
      shape:'card', theme:'lt', type:'options',
      label:'What kind of message?',
      opts:[
        {icon:'📅',name:'Schedule a meeting',sub:'Propose a time to connect'},
        {icon:'📎',name:'Share an update',sub:'Progress or findings'},
        {icon:'💬',name:'Quick question',sub:'Short, needs a reply'},
      ],
      aiGreet:"What's the message about?"
    },
    {
      shape:'sheet', theme:'lt', type:'draft',
      label:'Draft',
      aiGreet:"Here's a draft — edit directly or tell me to change the tone."
    },
    {
      shape:'card', theme:'lm', type:'done',
      aiGreet:null
    },
  ],

  grocery: [
    {
      shape:'pill', theme:'lt', type:'idle',
      icon:'🛒', placeholder:'What do you need?',
      aiGreet:"What do you need to get?"
    },
    {
      shape:'panel', theme:'dk', type:'list',
      label:'Your list',
      items:[],
      aiGreet:"I've started your list — tell me what else to add, or say done."
    },
    {
      shape:'card', theme:'lt', type:'options',
      label:'Order from',
      opts:[
        {icon:'🏪',name:'Whole Foods',sub:'Delivery by 3 PM · $6.99'},
        {icon:'🛒',name:"Trader Joe's",sub:'Pickup in 2h · Free'},
        {icon:'⚡',name:'Instacart',sub:'30-min delivery · $3.99'},
      ],
      aiGreet:"Where should I order from?"
    },
    {
      shape:'card', theme:'lt', type:'confirm',
      label:'Order summary',
      aiGreet:"Ready to place. Space to confirm."
    },
    {
      shape:'card', theme:'lm', type:'done',
      aiGreet:null
    },
  ],
};

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function getStep(){ return FLOWS[flow][step]; }

function render(skipGreet){
  if(isAnimating) return;
  isAnimating = true;
  focused = 0;

  const s    = getStep();
  const mc   = document.getElementById('mc');

  // morph shape/theme
  mc.className = `morph ${s.shape} ${s.theme}`;

  setTimeout(()=>{
    const inner = document.getElementById('mcInner');
    inner.innerHTML = buildStep(s);
    if(!skipGreet && s.aiGreet) addBubble('ai', s.aiGreet);
    isAnimating = false;
    updateSendBtn();
    // Auto-return to home after done
    if(s.type === 'done') setTimeout(resetFlow, 2800);
  }, 140);
}

function buildStep(s){
  const wrap = (html) => `<div class="morph-inner">${html}</div>`;

  if(s.type === 'idle'){
    return wrap(`<div style="padding:0 4px 16px;display:flex;align-items:flex-end;justify-content:center;min-height:54px;width:100%">
      <span style="font-size:20px;font-weight:300;color:rgba(255,255,255,.3);letter-spacing:-.01em;font-family:var(--sans);text-align:center">${s.placeholder}</span>
    </div>`);
  }

  if(s.type === 'options'){
    const dk = s.theme==='dk';
    return wrap(`<div class="p-panel">
      <div class="lbl ${dk?'lt':''}">${s.label}</div>
      <div class="opt-list" id="optList">
        ${s.opts.map((o,i)=>`
          <div class="opt${dk?' dk-opt':''}${i===focused?' focused':''}" data-i="${i}">
            <div class="opt-icon">${o.icon}</div>
            <div class="opt-body">
              <div class="opt-name">${o.name}</div>
              <div class="opt-sub">${o.sub}</div>
            </div>
            <div class="opt-indicator">space</div>
          </div>`).join('')}
      </div>
    </div>`);
  }

  if(s.type === 'dates'){
    const dep = data.depart, ret = data.return;
    return wrap(`<div class="p-card">
      <div class="lbl">${s.label}</div>
      <div class="date-pair">
        <div class="date-chip${dep?' filled':''}" id="dc-depart">
          <div class="dc-lbl">Depart</div>
          <div class="dc-val${dep?'':' empty'}">${dep||'Tell me a date'}</div>
        </div>
        <div class="date-chip${ret?' filled':''}" id="dc-return">
          <div class="dc-lbl">Return</div>
          <div class="dc-val${ret?'':' empty'}">${ret||'Tell me a date'}</div>
        </div>
      </div>
      ${dep&&ret?`<button class="cta" onclick="nextStep()">Continue →</button>
      <div class="cta-hint">or press space</div>`:'<div class="cta-hint">Tell me your dates in the chat</div>'}
    </div>`);
  }

  if(s.type === 'list'){
    const items = data.groceryItems || [];
    return wrap(`<div class="p-panel">
      <div class="lbl lt">${s.label} · ${items.length} item${items.length===1?'':'s'}</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto">
        ${items.length===0
          ? `<div style="font-size:20px;color:rgba(255,255,255,.3);padding:8px 0">Tell me what to add…</div>`
          : items.map((item,i)=>`
            <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.07);border-radius:10px">
              <span style="flex:1;font-size:20px;color:rgba(255,255,255,.85)">${item}</span>
              <span style="font-family:var(--mono);font-size:14px;color:rgba(255,255,255,.3);cursor:pointer" onclick="removeGroceryItem(${i})">✕</span>
            </div>`).join('')}
      </div>
      ${items.length>0?`<button class="cta" onclick="nextStep()">Continue →</button>`:''}
    </div>`);
  }

  if(s.type === 'draft'){
    const name = (data.contact||'Alice').split(' ')[0];
    const draft = data.draft || `Hi ${name},\n\nHope you're well. I wanted to reach out about scheduling some time to connect — would you have 30 minutes this week?\n\nBest`;
    return wrap(`<div class="p-panel" style="gap:10px">
      <div class="lbl">To ${data.contact||'Alice'}</div>
      <textarea id="draftArea" style="flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:20px;color:rgba(255,255,255,.88);line-height:1.65;resize:none;min-height:140px;outline:none">${draft}</textarea>
      <button class="cta" onclick="nextStep()">Send</button>
      <div class="cta-hint">or tell me to change the tone</div>
    </div>`);
  }

  if(s.type === 'confirm'){
    const rows = buildConfirmRows();
    return wrap(`<div class="p-card">
      <div class="lbl">${s.label}</div>
      <div class="conf-rows">${rows}</div>
      <button class="cta" onclick="nextStep()">Confirm</button>
      <div class="cta-hint">space to confirm · or tell me what to change</div>
    </div>`);
  }

  if(s.type === 'done'){
    const msgs = {
      flight:`ANA to ${data.destination||'Tokyo'}<br>${data.depart||'Mar 24'} – ${data.return||'Mar 31'} · Confirmation sent`,
      message:`Sent to ${data.contact||'Alice'}`,
      grocery:`${(data.groceryItems||[]).length||3} items from ${data.store||'Whole Foods'}<br>Arriving by 3 PM`
    };
    const icons = { flight:'✈', message:'✉', grocery:'✓' };
    return wrap(`<div class="success">
      <div class="s-icon">${icons[flow]}</div>
      <div class="s-title">${flow==='flight'?'Flight booked':flow==='message'?'Message sent':'Order placed'}</div>
      <div class="s-sub">${msgs[flow]||''}</div>
    </div>`);
  }

  return wrap('');
}

function buildConfirmRows(){
  if(flow==='flight'){
    return [
      ['Destination', data.destination||'Tokyo'],
      ['Depart',      data.depart||'—'],
      ['Return',      data.return||'—'],
      ['Passengers',  data.passengers||'1 adult'],
      ['Flight',      data.flight||'ANA 06:45 Non-stop'],
      ['Total',       '<span style="font-size:20px;font-weight:600">$842</span>'],
    ].map(([k,v])=>`<div class="conf-row"><span class="conf-key">${k}</span><span class="conf-val">${v}</span></div>`).join('');
  }
  if(flow==='grocery'){
    return [
      ['Items',    `${(data.groceryItems||[]).length||3} items`],
      ['From',     data.store||'Whole Foods'],
      ['Delivery', 'By 3 PM today'],
      ['Est. total','<span style="font-size:20px;font-weight:600">~$34</span>'],
    ].map(([k,v])=>`<div class="conf-row"><span class="conf-key">${k}</span><span class="conf-val">${v}</span></div>`).join('');

// KEYBOARD NAVIGATION
// ══════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const inp = document.getElementById('chatInp');
  const isFocusedOnInput = document.activeElement === inp;
  const s = getStep();

  // Escape = go home
  if(e.key==='Escape'){ e.preventDefault(); resetFlow(); return; }

  // X = cancel/back (only when input is empty)
  if(e.key==='x'||e.key==='X'){
    if(isFocusedOnInput && inp.value.length > 0) return;
    e.preventDefault();
    if(step > 0){ step--; render(false); }
    return;
  }

  // Arrow navigation — works regardless of input focus for list steps
  if((e.key==='ArrowDown'||e.key==='ArrowUp') && s.type==='options'){
    e.preventDefault();
    inp.blur();
    const opts = s.opts;
    if(e.key==='ArrowDown') focused = Math.min(focused+1, opts.length-1);
    else                    focused = Math.max(focused-1, 0);
    updateFocus();
    return;
  }

  // Space = confirm focused option or CTA
  if(e.key===' '){
    if(isFocusedOnInput && inp.value.length > 0) return; // let user type space
    e.preventDefault();
    if(s.type==='options'){ confirmOption(); return; }
    if(s.type==='confirm'||s.type==='dates'){ nextStep(); return; }
    if(s.type==='done'){ resetFlow(); return; }
    return;
  }

  // Typing → focus input
  if(e.key.length===1 && !e.metaKey && !e.ctrlKey && !isFocusedOnInput){
    inp.focus();
  }
});

function updateFocus(){
  document.querySelectorAll('.opt').forEach((el,i)=>{
    el.classList.toggle('focused', i===focused);
  });
}

function confirmOption(){
  const s = getStep();
  const opt = s.opts[focused];
  if(!opt) return;
  // Store data
  if(flow==='flight'&&step===2) data.passengers = opt.name;
  if(flow==='flight'&&step===3) data.flight = opt.name;
  if(flow==='message'&&step===1){ data.contact = opt.name; }
  if(flow==='message'&&step===2){ data.topic = opt.name; }
  if(flow==='grocery'&&step===2){ data.store = opt.name; }
  addBubble('user', opt.name);
  setTimeout(()=>nextStep(), 180);
}

function nextStep(){
  const maxStep = FLOWS[flow].length - 1;
  if(step < maxStep){ step++; render(false); }
}

function buildSystemPrompt(){
  const s = getStep();
  const firstName = (data.contact||'Alice').split(' ')[0];
  const flowLabel = { flight:'flight booking', message:'message drafting', grocery:'grocery ordering' }[flow];

  const optionsBlock = (s.type==='options' && s.opts)
    ? `\nAvailable options (0-indexed):\n${s.opts.map((o,i)=>`  [${i}] ${o.name} — ${o.sub}`).join('\n')}`
    : '';

  const dataBlock = Object.keys(data).length
    ? `\nCollected data so far: ${JSON.stringify(data)}`
    : '';

  const draftHint = s.type==='draft'
    ? `\nDraft tone change → rewrite the entire draft for ${firstName} and return it in data.draft. Keep it under 60 words.`
    : '';

  const listHint = s.type==='list'
    ? `\nList items so far: ${JSON.stringify(data.groceryItems||[])}. Add new items to data.groceryItems as an updated full array. "done"/"next"/"continue" → action "next".`
    : '';

  return `You are the AI brain of a structured task UI. The user moves step-by-step through a flow. Each step collects ONE thing. Do not mix steps.

CURRENT STATE
Flow: ${flowLabel}
Step type: ${s.type}${s.label ? `\nStep label: ${s.label}` : ''}${dataBlock}${optionsBlock}${draftHint}${listHint}

STRICT STEP RULES — only collect what this step asks for:

IDLE step (flight):
  - Collect ONLY the destination city. Nothing else.
  - The user's entire message is the destination. Even short inputs like "la", "nyc", "sf" are city codes — treat them as cities, NEVER as dates.
  - If they mention an event (Coachella, SXSW), use web search to find where it is, set that as destination, action "next" with {destination:"City Name"}.
  - Do NOT extract dates at this step. Do NOT advance past this step with date info.

IDLE step (message):
  - Collect ONLY the recipient name.

IDLE step (grocery):
  - Collect ONLY the initial list of items.

DATES step:
  - The destination is already known. Do NOT ask for it again.
  - Collect depart and/or return dates. Format as "Mon DD" (e.g. "Apr 11").
  - If user gives one date, use context ("leaving", "back", "return") to assign it correctly.
  - Both dates found → action "next" with {depart, return}.
  - One date found → action "update" with whichever field, ask for the other.
  - Event references (Coachella Week 1) → use web search to resolve to real dates, then action "next".

OPTIONS step:
  - Match user input to one of the listed options by name/keyword → action "select" with {index: N}.
  - Ambiguous → action "stay" and ask to clarify.

CONFIRM step:
  - "yes", "ok", "looks good", "confirm", "book it" → action "next".
  - Change request → action "back" or "stay".

DRAFT step:
  - Tone/edit request → action "update" with {draft: "<rewritten text under 60 words>"}.

LIST step:
  - Add items → action "update" with {groceryItems: [...full updated array]}.
  - "done"/"next"/"continue" → action "next".

DONE step:
  - action "stay" with a brief warm closing line.

RESPONSE FORMAT — respond ONLY with this JSON, no preamble, no markdown:
{
  "reply": "short warm reply, 1-2 sentences, plain text only",
  "action": "next" | "update" | "select" | "stay" | "back",
  "data": {}
}`;
}

async function callClaude(userText){
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: buildSystemPrompt(),
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages: [{ role: 'user', content: userText }]
    })
  });
  if(!response.ok) throw new Error(`API ${response.status}`);
  const d = await response.json();
  // Collect all text blocks (web search may precede the JSON)
  const raw = d.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
  // Extract the first complete {...} JSON object from anywhere in the text
  const match = raw.match(/\{[\s\S]*\}/);
  if(!match) throw new Error('No JSON object found in response');
  return JSON.parse(match[0]);
}

async function processNL(text){
  showTyping();
  try {
    const result = await callClaude(text);
    hideTyping();

    if(result.reply) addBubble('ai', result.reply);

    switch(result.action){

      case 'next':
        if(result.data) Object.assign(data, result.data);
        // Claude already replied — skip the step's hardcoded aiGreet
        step++;
        render(true);
        break;

      case 'update': {
        if(result.data) Object.assign(data, result.data);
        // Re-render the current step in-place
        const inner = document.getElementById('mcInner');
        inner.innerHTML = `<div class="morph-inner">${buildStep(getStep())}</div>`;
        // Flash date chips if dates were updated
        ['depart','return'].forEach(field=>{
          if(result.data?.[field]){
            const chip = document.getElementById(`dc-${field}`);
            if(chip){ chip.classList.remove('filled'); void chip.offsetWidth; chip.classList.add('filled','just-filled'); }
          }
        });
        break;
      }

      case 'select':
        if(typeof result.data?.index === 'number'){
          focused = result.data.index;
          updateFocus();
          setTimeout(()=>confirmOption(), 400);
        }
        break;

      case 'back':
        if(step > 0){ step--; render(false); }
        break;

      case 'stay':
      default:
        break;
    }
  } catch(err) {
    hideTyping();
    console.error('Claude API error:', err);
    addBubble('ai', 'Something went wrong — try again.');
  }
}

// ── Parsing helpers ───────────────────────────
function extractDestination(text){
  const places = ['tokyo','paris','london','new york','bali','sydney','bangkok','dubai','rome','berlin','singapore','amsterdam'];
  for(const p of places){
    if(text.toLowerCase().includes(p)) return p.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
  }
  const m = text.match(/to\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)/);
  if(m) return m[1];
  return text.trim();
}

function parseDates(text){
  const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
    january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
  const nums = {'1st':1,'2nd':2,'3rd':3,'4th':4,'5th':5,'6th':6,'7th':7,'8th':8,'9th':9,'10th':10,
    '11th':11,'12th':12,'13th':13,'14th':14,'15th':15,'16th':16,'17th':17,'18th':18,'19th':19,'20th':20,
    '21st':21,'22nd':22,'23rd':23,'24th':24,'25th':25,'26th':26,'27th':27,'28th':28,'29th':29,'30th':30,'31st':31};
  const t = text.toLowerCase();
  let depart = null, ret = null;

  // Pattern: "feb 23" or "23 feb"
  const datePattern = /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|january|february|march|april|june|july|august|september|october|november|december)\s+(\d{1,2})(?:st|nd|rd|th)?|\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|january|february|march|april|june|july|august|september|october|november|december)\b/gi;
  const matches = [...t.matchAll(datePattern)];

  function fmt(month, day){
    const m = month.toLowerCase().slice(0,3);
    const mn = {jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'}[m]||month;
    return `${mn} ${day}`;
  }

  if(matches.length >= 1){
    const m1 = matches[0];
    const [mo1,da1] = m1[1] ? [m1[1],m1[2]] : [m1[4],m1[3]];
    // Check if this date is mentioned with "leave/depart" context or just first
    const beforeFirst = t.slice(0, m1.index);
    const isReturn = /back|return|coming back|home|return/.test(beforeFirst);
    if(isReturn) ret = fmt(mo1, da1);
    else depart = fmt(mo1, da1);
  }
  if(matches.length >= 2){
    const m2 = matches[1];
    const [mo2,da2] = m2[1] ? [m2[1],m2[2]] : [m2[4],m2[3]];
    const beforeSecond = t.slice(0, m2.index);
    const isReturn = /back|return|coming back|home/.test(beforeSecond);
    if(isReturn||depart) ret = fmt(mo2, da2);
    else depart = fmt(mo2, da2);
  }

  // Single date with context keywords
  if(matches.length===1&&!ret){
    const m1 = matches[0];
    const [mo1,da1] = m1[1]?[m1[1],m1[2]]:[m1[4],m1[3]];
    const ctx = t;
    if(/back|return|coming back/.test(ctx)) ret = fmt(mo1, da1);
    else depart = fmt(mo1, da1);
  }

  return { depart, ret };
}

async function handleChat(){
  if(onHome){

    const text = inp.value.trim();
    if(!text) return;
    const t = text.toLowerCase();
    if(t.includes('flight')||t.includes('fly')||t.includes('book')) flow = 'flight';
    else if(t.includes('message')||t.includes('send')||t.includes('email')||t.includes('draft')) flow = 'message';
    else if(t.includes('grocer')||t.includes('order')||t.includes('buy')) flow = 'grocery';

  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  updateSendBtn();
  addBubble('user', text);

}

(function initOrb(){
  const canvas = document.getElementById('orbCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 144, H = 144, cx = W/2, cy = H/2;

  // Metaball-style blobs
  const blobs = [
    { x: cx, y: cy, r: 38, vx: 0.18, vy: 0.12, hue: 210 },
    { x: cx-18, y: cy+10, r: 28, vx:-0.14, vy: 0.20, hue: 200 },
    { x: cx+16, y: cy-12, r: 24, vx: 0.22, vy:-0.16, hue: 220 },
  ];

  let t = 0;
  function draw(){
    ctx.clearRect(0,0,W,H);

    // Clip to circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,W/2,0,Math.PI*2);
    ctx.clip();

    // Deep background
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0,0,W,H);

    // Animated blobs
    blobs.forEach((b,i)=>{
      b.x += b.vx;
      b.y += b.vy;
      // soft bounce within a radius
      const dist = Math.hypot(b.x-cx, b.y-cy);
      if(dist > 22){ b.vx *= -1; b.vy *= -1; }

      const phase = t * 0.008 + i * 2.1;
      const pulse = 1 + 0.08 * Math.sin(phase);
      const r = b.r * pulse;

      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      g.addColorStop(0,   `hsla(${b.hue},80%,72%,0.28)`);
      g.addColorStop(0.5, `hsla(${b.hue},60%,55%,0.10)`);
      g.addColorStop(1,   `hsla(${b.hue},40%,40%,0)`);
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI*2);
      ctx.fillStyle = g;
      ctx.fill();
    });

    // Subtle noise shimmer
    const shimmer = ctx.createRadialGradient(cx,cy-10,0,cx,cy,W/2);
    shimmer.addColorStop(0,   'rgba(255,255,255,0.04)');
    shimmer.addColorStop(0.6, 'rgba(255,255,255,0.00)');
    shimmer.addColorStop(1,   'rgba(255,255,255,0.02)');
    ctx.fillStyle = shimmer;
    ctx.fillRect(0,0,W,H);

    ctx.restore();

    // Breathing outer ring glow
    const glow = 0.4 + 0.15 * Math.sin(t * 0.012);
    ctx.beginPath();
    ctx.arc(cx,cy,W/2-1,0,Math.PI*2);
    ctx.strokeStyle = `rgba(160,200,255,${glow * 0.18})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    t++;
    requestAnimationFrame(draw);
  }
  draw();
})();

</script>
</body>
</html>
