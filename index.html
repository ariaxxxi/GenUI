<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GenUI Sys - Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="src/styles/shared.css"/>
<link rel="stylesheet" href="src/styles/editor-layout.css"/>
<link rel="stylesheet" href="src/styles/editor-sidebar.css"/>
<link rel="stylesheet" href="src/styles/editor-decorative.css"/>
</head>
<body class="mode-manual" data-page-mode="manual">
<div class="bg-blur-image"></div>

<style id="anim-style">
  :root {
    --motion-ease: cubic-bezier(0.35, 0.23, 0.13, 0.98);
    --spring: var(--motion-ease);
    --anim-w:  450ms var(--spring);
    --anim-h:  450ms var(--spring);
    --anim-br: 450ms var(--spring);
    --anim-tx: 450ms var(--spring);
    --anim-t:  450ms var(--spring);
  }
</style>


<div id="left-sidebar">
  <div class="sb-section" data-collapsible="1">
    <button class="sb-section-toggle" type="button">
      <div class="sb-heading">Canvas</div>
      <span class="sb-chevron">▾</span>
    </button>
    <div class="sb-section-body">
      <label class="sb-toggle" for="frame-glasses-toggle">
        <div class="sb-toggle-copy">
          <strong>Glasses</strong>
        </div>
        <input id="frame-glasses-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
      <label class="sb-toggle" for="frame-phone-toggle">
        <div class="sb-toggle-copy">
          <strong>Phone</strong>
        </div>
        <input id="frame-phone-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
      <div id="phone-frame-controls" class="sb-row tight hidden">
        <div class="sb-pair-row">
          <div class="sb-pair-col">
            <label class="sb-lbl" for="phone-frame-width">Phone width</label>
            <input id="phone-frame-width" class="sb-input" type="text" inputmode="numeric" placeholder="390"/>
          </div>
          <div class="sb-pair-col">
            <label class="sb-lbl" for="phone-frame-height">Phone height</label>
            <input id="phone-frame-height" class="sb-input" type="text" inputmode="numeric" placeholder="838"/>
          </div>
        </div>
        <label class="sb-lbl" for="frame-corner-radius">Frame corner radius</label>
        <input id="frame-corner-radius" class="sb-input" type="text" inputmode="numeric" placeholder="48"/>
        <label class="sb-lbl" for="phone-bg-upload">Phone frame background</label>
        <div class="media-upload-row">
          <label class="sb-mini-btn upload-btn" for="phone-bg-upload">Upload<input id="phone-bg-upload" type="file" accept="image/*"/></label>
          <button id="phone-bg-reset" class="sb-mini-btn" type="button">Reset</button>
        </div>
        <div id="phone-bg-state" class="icon-mode-badge">empty</div>
      </div>
      <div class="sb-row tight mode-ai-only">
        <span class="sb-lbl">Stage override</span>
        <div class="shape-chip-row">
          <button class="shape-chip" data-ai-stage="auto" type="button">Auto</button>
          <button class="shape-chip" data-ai-stage="dot" type="button">Dot</button>
          <button class="shape-chip" data-ai-stage="pill" type="button">Pill</button>
          <button class="shape-chip" data-ai-stage="card" type="button">Card</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sb-section mode-manual-only" data-collapsible="1">
    <button class="sb-section-toggle" type="button">
      <div class="sb-heading">Scenarios</div>
      <span class="sb-chevron">▾</span>
    </button>
    <div class="sb-section-body">
      <div class="sb-btn-row">
        <button id="scenario-add" class="sb-mini-btn" type="button">Add</button>
        <button id="scenario-duplicate" class="sb-mini-btn" type="button">Duplicate</button>
        <button id="scenario-delete" class="sb-mini-btn" type="button">Delete</button>
      </div>
      <div id="scenario-list" class="scenario-list"></div>
    </div>
  </div>

  <div class="sb-section" data-collapsible="1">
    <button class="sb-section-toggle" type="button">
      <div class="sb-heading">Settings</div>
      <span class="sb-chevron">▾</span>
    </button>
    <div class="sb-section-body">
      <label class="sb-toggle" for="float-toggle">
        <div class="sb-toggle-copy">
          <strong>Floating effect</strong>
        </div>
        <input id="float-toggle" class="sb-toggle-input" type="checkbox" checked/>
      </label>
      <label class="sb-toggle" for="align-bottom-toggle">
        <div class="sb-toggle-copy">
          <strong>Bottom align</strong>
        </div>
        <input id="align-bottom-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
      <label class="sb-toggle" for="bg-toggle">
        <div class="sb-toggle-copy">
          <strong>Background image</strong>
        </div>
        <input id="bg-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
    </div>
  </div>

  <div class="sb-section mode-toggle-bottom hidden"></div>
</div>

<div id="main-col">
  <div id="ui-frame">
    <div id="ui-frame-bg"></div>
    <div id="stage-wrap">
      <div id="intent-header">
        <span id="intent-label">Book a Flight</span>
        <div id="intent-step-dot"></div>
        <span id="intent-step-lbl"></span>
      </div>

      <div id="stage">
        <div class="drop" id="drop-main">
          <div id="home-glow-layer"></div>
          <div id="prototype-stage-selection" aria-hidden="true">
            <div class="g-stage-selected-accent g-stage-selected-accent-left">
              <div class="g-stage-selected-accent-left-base"></div>
              <div class="g-stage-selected-accent-left-white-2"></div>
              <div class="g-stage-selected-accent-left-white-1"></div>
            </div>
            <div class="g-stage-selected-accent g-stage-selected-accent-right">
              <div class="g-stage-selected-accent-right-base"></div>
              <div class="g-stage-selected-accent-right-white-2"></div>
              <div class="g-stage-selected-accent-right-white-1"></div>
            </div>
            <div class="g-stage-selected-inner-glow"></div>
            <div class="g-stage-selected-ring"></div>
          </div>
          <div id="c-thumb"><span id="c-thumb-label"></span><img id="c-thumb-img" alt=""/></div>
          <div id="c-primary"></div>
          <div id="c-secondary"></div>
          <div id="c-divider"></div>
          <div id="c-detail"></div>
          <img id="c-media" alt=""/>
          <div id="c-rich"></div>
          <div id="siri-orb"><canvas id="siri-canvas"></canvas></div>
        </div>
        <div class="drop" id="drop-left"></div>
        <div class="drop" id="drop-right"></div>
        <div id="list-pills"></div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <input id="user-input" type="text" autocomplete="off" spellcheck="false"
        placeholder="What's the weather? · Book a flight · Send a message…"/>
      <button id="send-btn" onclick="handleSend()">↑</button>
    </div>
    <div id="example-chips">
      <button class="ex-chip" onclick="fireChip(this)">What's the weather?</button>
      <button class="ex-chip" onclick="fireChip(this)">Book a flight to Tokyo</button>
      <button class="ex-chip" onclick="fireChip(this)">Send a message to Alice</button>
      <button class="ex-chip" onclick="fireChip(this)">Set a 10 min timer</button>
      <button class="ex-chip" onclick="fireChip(this)">Call Mom</button>
    </div>
  </div>
</div>

<div id="sidebar">

  <!-- Scenario name — always visible, always editable -->
  <div class="sb-scenario-header mode-manual-only">
    <input id="scenario-name" class="sb-input sb-scenario-name-input" type="text" autocomplete="off" spellcheck="false" placeholder="Scenario name"/>
  </div>

  <!-- Tab bar -->
  <div class="sb-tabs mode-manual-only" id="sb-tab-bar">
    <button class="sb-tab active" data-tab="stage" type="button">Stage</button>
    <button class="sb-tab" data-tab="content" type="button">Content</button>
    <button class="sb-tab" data-tab="style" type="button">Style</button>
    <button class="sb-tab" data-tab="config" type="button">Config</button>
  </div>

  <!-- ── Stage tab ── -->
  <div class="sb-tab-panel mode-manual-only" data-panel="stage">

    <div class="sb-row tight">
      <span class="sb-lbl">Stage</span>
      <div class="stage-timeline" id="scenario-shape-row"></div>
    </div>

    <div class="sb-btn-row stage-actions">
      <div class="stage-add-group">
        <select id="stage-add-kind" class="sb-select" aria-label="New stage type">
          <option value="dot">Dot</option>
          <option value="pill">Pill</option>
          <option value="card" selected>Card</option>
          <option value="blank">Blank</option>
        </select>
        <button id="stage-add" class="sb-mini-btn" type="button">Add</button>
      </div>
      <button id="stage-delete" class="sb-mini-btn icon-btn" type="button" title="Delete stage" aria-label="Delete stage">🗑</button>
      <button id="stage-reset" class="sb-mini-btn icon-btn" type="button" title="Reset stage" aria-label="Reset stage">↻</button>
    </div>

    <div id="stage-config-panel" class="sb-row tight">
      <label class="sb-lbl" for="stage-name-input">Stage name</label>
      <input id="stage-name-input" class="sb-input" type="text" autocomplete="off" spellcheck="false"/>
      <label class="sb-lbl" for="stage-radius-input">Corner radius</label>
      <input id="stage-radius-input" class="sb-input" type="text" inputmode="numeric" placeholder="0–120"/>
      <div class="sb-pair-row">
        <div class="sb-pair-col">
          <label class="sb-lbl" for="stage-width-input">Width override</label>
          <input id="stage-width-input" class="sb-input" type="text" inputmode="numeric" placeholder="Default"/>
        </div>
        <div class="sb-pair-col">
          <label class="sb-lbl" for="stage-height-input">Height override</label>
          <input id="stage-height-input" class="sb-input" type="text" inputmode="numeric" placeholder="Default"/>
        </div>
      </div>
      <div class="sb-pair-row">
        <div class="sb-pair-col">
          <label class="sb-lbl" for="stage-icon-pad-input">Icon left pad</label>
          <input id="stage-icon-pad-input" class="sb-input" type="text" inputmode="numeric" placeholder="Default"/>
        </div>
        <div class="sb-pair-col">
          <label class="sb-lbl" for="stage-gap-input">Icon gap</label>
          <input id="stage-gap-input" class="sb-input" type="text" inputmode="numeric" placeholder="Default"/>
        </div>
      </div>
      <div id="stage-card-s-row" class="sb-row tight hidden">
        <label class="sb-toggle" for="stage-card-s-toggle">
          <div class="sb-toggle-copy"><strong>Card-S layout</strong></div>
          <input id="stage-card-s-toggle" class="sb-toggle-input" type="checkbox"/>
        </label>
      </div>
      <div id="stage-components-panel" class="sb-row tight hidden">
        <span class="sb-lbl">Components</span>
        <div id="stage-component-controls"></div>
      </div>
      <div id="phone-scene-visible-row" class="sb-row tight hidden">
        <label class="sb-toggle" for="phone-bg-visible-toggle">
          <div class="sb-toggle-copy"><strong>Phone scene visible</strong></div>
          <input id="phone-bg-visible-toggle" class="sb-toggle-input" type="checkbox" checked/>
        </label>
      </div>
    </div>

  </div>

  <!-- ── Content tab ── -->
  <div class="sb-tab-panel sb-tab-panel-hidden mode-manual-only" data-panel="content">

    <!-- Icon layer row -->
    <div id="editor-icon-layer" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Icon</span>
        <span class="layer-row-preview">
          <span id="layer-preview-icon-text" class="layer-preview-val"></span>
          <span id="layer-preview-icon-size" class="layer-preview-size"></span>
          <span id="layer-preview-icon-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <div class="icon-upload-row">
          <input id="scenario-icon-input" class="sb-input" type="text" maxlength="4" autocomplete="off" spellcheck="false" placeholder="Emoji or glyph"/>
          <label class="sb-mini-btn upload-btn" for="scenario-icon-upload">PNG<input id="scenario-icon-upload" type="file" accept="image/png,image/gif"/></label>
          <button id="scenario-icon-reset" class="sb-mini-btn" type="button">×</button>
        </div>
        <div id="scenario-icon-mode" class="icon-mode-badge">emoji</div>
        <div class="typo-controls">
          <input id="scenario-icon-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Icon size"/>
          <input id="scenario-icon-color" class="typo-color" type="color" value="#ffffff"/>
        </div>
      </div>
    </div>

    <!-- Primary layer row -->
    <div id="editor-primary-field" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Primary</span>
        <span class="layer-row-preview">
          <span id="layer-preview-primary-text" class="layer-preview-val"></span>
          <span id="layer-preview-primary-size" class="layer-preview-size"></span>
          <span id="layer-preview-primary-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-primary" class="sb-input" type="text" autocomplete="off" spellcheck="false"/>
        <div class="typo-controls">
          <input id="scenario-primary-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-primary-color" class="typo-color" type="color" value="#ffffff"/>
        </div>
      </div>
    </div>

    <!-- Secondary layer row -->
    <div id="editor-secondary-field" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Secondary</span>
        <span class="layer-row-preview">
          <span id="layer-preview-secondary-text" class="layer-preview-val"></span>
          <span id="layer-preview-secondary-size" class="layer-preview-size"></span>
          <span id="layer-preview-secondary-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-secondary" class="sb-input" type="text" autocomplete="off" spellcheck="false"/>
        <div class="typo-controls">
          <input id="scenario-secondary-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-secondary-color" class="typo-color" type="color" value="#8a8a8a"/>
        </div>
      </div>
    </div>

    <!-- Detail layer row -->
    <div id="editor-detail-field" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Detail</span>
        <span class="layer-row-preview">
          <span id="layer-preview-detail-text" class="layer-preview-val"></span>
          <span id="layer-preview-detail-size" class="layer-preview-size"></span>
          <span id="layer-preview-detail-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-detail" class="sb-input" type="text" autocomplete="off" spellcheck="false"/>
        <div class="typo-controls">
          <input id="scenario-detail-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-detail-color" class="typo-color" type="color" value="#5a5a5a"/>
        </div>
      </div>
    </div>

    <div id="editor-intent-header-field" class="layer-row editor-field hidden">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Intent Header</span>
        <span class="layer-row-preview">
          <span id="layer-preview-intent-header-text" class="layer-preview-val"></span>
          <span id="layer-preview-intent-header-size" class="layer-preview-size"></span>
          <span id="layer-preview-intent-header-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-intent-header" class="sb-input" type="text" autocomplete="off" spellcheck="false" placeholder="Intent header text"/>
        <div class="typo-controls">
          <input id="scenario-intent-header-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-intent-header-color" class="typo-color" type="color" value="#666666"/>
        </div>
      </div>
    </div>

    <!-- Media -->
    <div id="editor-media-field" class="sb-row tight editor-field hidden">
      <label class="sb-lbl">Card image(s)</label>
      <div id="scenario-media-list" class="media-list"></div>
    </div>

  </div>

  <!-- ── Style tab ── -->
  <div class="sb-tab-panel sb-tab-panel-hidden mode-manual-only" data-panel="style">

    <div class="sb-row tight">
      <label class="sb-toggle" for="stage-phone-blur-toggle">
        <div class="sb-toggle-copy"><strong>Phone BG blur</strong></div>
        <input id="stage-phone-blur-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
    </div>

    <div class="sb-row tight">
      <label class="sb-toggle" for="stage-selected-toggle">
        <div class="sb-toggle-copy"><strong>Selected</strong></div>
        <input id="stage-selected-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
    </div>

    <div class="sb-row tight">
      <label class="sb-lbl" for="stage-accent-color">Accent primary</label>
      <input id="stage-accent-color" class="typo-color" type="color" value="#90acff"/>
    </div>

    <div class="sb-row tight">
      <label class="sb-lbl" for="stage-accent-secondary-color">Accent secondary</label>
      <input id="stage-accent-secondary-color" class="typo-color" type="color" value="#9761ff"/>
    </div>

    <div class="sb-section" data-collapsible="1">
      <button class="sb-section-toggle" type="button">
        <div class="sb-heading">Animation</div>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="sb-row">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <span class="sb-lbl">Duration</span>
            <span class="sb-val" id="dur-val">450ms</span>
          </div>
          <input type="range" id="dur-sl" min="100" max="1400" step="50" value="450"/>
        </div>
        <div class="sb-row">
          <span class="sb-lbl">Easing</span>
          <select id="ease-select">
            <option value="custom" selected>Custom bezier</option>
            <option value="spring">Liquid feeling</option>
            <option value="ease">Ease</option>
            <option value="linear">Linear</option>
          </select>
        </div>
        <div class="sb-row" id="bz-group">
          <span class="sb-lbl">Bezier</span>
          <div id="bz-row">
            <input class="bz-inp" id="bz-input" type="text" value="0.35, 0.23, 0.13, 0.98" autocomplete="off" spellcheck="false" placeholder="0.2, 0.2, 0.1, 1"/>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Config tab ── -->
  <div class="sb-tab-panel sb-tab-panel-hidden mode-manual-only" data-panel="config">

    <div class="sb-row tight">
      <label class="sb-lbl" for="scenario-triggers">AI match phrases</label>
      <textarea id="scenario-triggers" class="sb-textarea" spellcheck="false" placeholder="qr code, boarding pass, check in"></textarea>
    </div>

    <div class="sb-section collapsed" data-collapsible="1">
      <button class="sb-section-toggle" type="button">
        <div class="sb-heading">Legacy / Debug</div>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="legacy-grid">
          <button class="sb-shape-btn active" data-shape="circle" onclick="manualShape('circle')"><span class="sb-shape-num">1</span> Home</button>
          <button class="sb-shape-btn" data-shape="list" onclick="manualShape('list')"><span class="sb-shape-num">5</span> List</button>
          <button class="sb-shape-btn" data-shape="split" onclick="manualShape('split')"><span class="sb-shape-num">6</span> Split</button>
          <button class="sb-shape-btn" data-shape="ai" onclick="manualShape('ai')"><span class="sb-shape-num">8</span> Thinking</button>
          <button class="sb-shape-btn" data-shape="custom" onclick="openCustom()"><span class="sb-shape-num">7</span> Custom</button>
        </div>
      </div>
    </div>

    <div class="sb-section" data-collapsible="1">
      <button class="sb-section-toggle" type="button">
        <div class="sb-heading">Export</div>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="sb-btn-row">
          <button class="sb-mini-btn" type="button" onclick="copyStagePng()">Copy PNG</button>
          <button class="sb-mini-btn" type="button" onclick="exportStageSvg()" disabled style="opacity:0.3;cursor:not-allowed">Export SVG</button>
        </div>
      </div>
    </div>

  </div>


</div>

<a class="entry-point-btn" href="./ai.html">ai mode</a>

<script src="src/shared/modern-screenshot.min.js"></script>
<script type="module" src="src/tool/index-app.js"></script>
</body>
</html>
