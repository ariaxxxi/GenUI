<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fluid Interface Toolkit</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="src/styles/shared.css"/>
<link rel="stylesheet" href="src/styles/ai-glass.css"/>
<link rel="stylesheet" href="src/styles/ai-decorative.css"/>
<link rel="stylesheet" href="src/styles/editor-layout.css"/>
<link rel="stylesheet" href="src/styles/editor-sidebar.css"/>
<link rel="stylesheet" href="src/styles/editor-decorative.css"/>
</head>
<body class="mode-manual" data-page-mode="manual">
<div class="bg-blur-image"></div>
<video class="bg-blur-video" muted playsinline preload="metadata" aria-hidden="true"></video>

<style id="anim-style">
  :root {
    --motion-ease: cubic-bezier(0.35, 0.23, 0.13, 0.98);
    --spring: var(--motion-ease);
    --anim-w:  450ms var(--spring);
    --anim-h:  450ms var(--spring);
    --anim-br: 450ms var(--spring);
    --anim-tx: 450ms var(--spring);
    --anim-t:  450ms var(--spring);
  }
</style>


<div id="left-sidebar">
  <div class="sb-section" data-collapsible="1">
    <button class="sb-section-toggle" type="button">
      <div class="sb-heading">Canvas</div>
      <span class="sb-chevron">▾</span>
    </button>
    <div class="sb-section-body">
      <label class="sb-toggle" for="frame-glasses-toggle">
        <div class="sb-toggle-copy">
          <strong>Glasses</strong>
        </div>
        <input id="frame-glasses-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
      <label class="sb-toggle" for="frame-phone-toggle">
        <div class="sb-toggle-copy">
          <strong>Phone</strong>
        </div>
        <input id="frame-phone-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
      <div id="phone-frame-controls" class="sb-row tight hidden">
        <div class="sb-pair-row">
          <div class="sb-pair-col">
            <label class="sb-lbl" for="phone-frame-width">Phone width</label>
            <input id="phone-frame-width" class="sb-input" type="text" inputmode="numeric" placeholder="390"/>
          </div>
          <div class="sb-pair-col">
            <label class="sb-lbl" for="phone-frame-height">Phone height</label>
            <input id="phone-frame-height" class="sb-input" type="text" inputmode="numeric" placeholder="838"/>
          </div>
        </div>
        <label class="sb-lbl" for="frame-corner-radius">Frame corner radius</label>
        <input id="frame-corner-radius" class="sb-input" type="text" inputmode="numeric" placeholder="48"/>
        <label class="sb-lbl" for="phone-bg-upload">Phone frame background</label>
        <div class="media-upload-row">
          <label class="sb-mini-btn upload-btn" for="phone-bg-upload">Upload<input id="phone-bg-upload" type="file" accept="image/*"/></label>
          <button id="phone-bg-reset" class="sb-mini-btn" type="button">Reset</button>
        </div>
        <div id="phone-bg-state" class="icon-mode-badge">empty</div>
      </div>
      <div class="sb-row tight mode-ai-only">
        <span class="sb-lbl">Stage override</span>
        <div class="shape-chip-row">
          <button class="shape-chip" data-ai-stage="auto" type="button">Auto</button>
          <button class="shape-chip" data-ai-stage="dot" type="button">Dot</button>
          <button class="shape-chip" data-ai-stage="pill" type="button">Pill</button>
          <button class="shape-chip" data-ai-stage="card" type="button">Card</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sb-section mode-manual-only" data-collapsible="1">
    <button class="sb-section-toggle" type="button">
      <div class="sb-heading">Scenarios</div>
      <span class="sb-chevron">▾</span>
    </button>
    <div class="sb-section-body">
      <div class="sb-btn-row">
        <button id="scenario-add" class="sb-mini-btn" type="button">Add</button>
        <button id="scenario-duplicate" class="sb-mini-btn" type="button">Duplicate</button>
        <button id="scenario-delete" class="sb-mini-btn" type="button">Delete</button>
      </div>
      <div id="scenario-list" class="scenario-list"></div>
    </div>
  </div>

  <div class="sb-section" data-collapsible="1">
    <button class="sb-section-toggle" type="button">
      <div class="sb-heading">Settings</div>
      <span class="sb-chevron">▾</span>
    </button>
    <div class="sb-section-body">
      <label class="sb-toggle" for="float-toggle">
        <div class="sb-toggle-copy">
          <strong>Floating effect</strong>
        </div>
        <input id="float-toggle" class="sb-toggle-input" type="checkbox" checked/>
      </label>
      <label class="sb-toggle" for="align-bottom-toggle">
        <div class="sb-toggle-copy">
          <strong>Bottom align</strong>
        </div>
        <input id="align-bottom-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
      <label class="sb-toggle" for="bg-toggle">
        <div class="sb-toggle-copy">
          <strong>Background image</strong>
        </div>
        <input id="bg-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
      <div class="sb-row tight">
        <label class="sb-lbl" for="bg-image-select">Background preset</label>
        <select id="bg-image-select" class="sb-select" aria-label="Background preset">
          <option value="assets/bg/living room.jpg">Living room</option>
          <option value="assets/bg/living room 2.jpg">Living room 2</option>
          <option value="assets/bg/desk.jpg">Desk</option>
          <option value="assets/bg/work.jpg">Work</option>
          <option value="assets/bg/park.jpg">Park</option>
          <option value="assets/bg/street.jpg">Street</option>
          <option value="assets/bg/grocery store.jpg">Grocery store</option>
          <option value="assets/bg/kitechen.jpg">Kitechen</option>
        </select>
      </div>
      <div class="sb-row tight">
        <label class="sb-lbl" for="bg-image-upload">Background image upload</label>
        <div class="media-upload-row">
          <label class="sb-mini-btn upload-btn" for="bg-image-upload">Upload<input id="bg-image-upload" type="file" accept="image/*"/></label>
          <button id="bg-image-reset" class="sb-mini-btn" type="button">Reset</button>
        </div>
      </div>
      <div id="bg-image-state" class="icon-mode-badge">preset</div>
      <div class="sb-row tight">
        <label class="sb-lbl" for="bg-image-alpha">Image alpha</label>
        <input id="bg-image-alpha" class="sb-input" type="range" min="0" max="100" step="1" value="90"/>
      </div>
      <div class="sb-row tight">
        <label class="sb-lbl" for="bg-video-upload">Background video</label>
        <div class="media-upload-row">
          <label class="sb-mini-btn upload-btn" for="bg-video-upload">Upload<input id="bg-video-upload" type="file" accept="video/*"/></label>
          <button id="bg-video-reset" class="sb-mini-btn" type="button">Reset</button>
        </div>
      </div>
      <div id="bg-video-state" class="icon-mode-badge">empty</div>
      <div id="bg-video-controls" class="sb-row tight hidden">
        <div class="sb-btn-row">
          <button id="bg-video-play-toggle" class="sb-mini-btn" type="button">Play</button>
        </div>
        <label class="sb-lbl" for="bg-video-progress">Video progress</label>
        <input id="bg-video-progress" class="sb-input" type="range" min="0" max="1000" step="1" value="0"/>
        <label class="sb-lbl" for="bg-video-alpha">Video alpha</label>
        <input id="bg-video-alpha" class="sb-input" type="range" min="0" max="100" step="1" value="80"/>
      </div>
    </div>
  </div>

  <div class="sb-section mode-toggle-bottom hidden"></div>
</div>

<div id="main-col">
  <div id="ui-frame">
    <div id="ui-frame-bg"></div>
    <div id="stage-wrap">
      <div id="intent-header">
        <span id="intent-label">Book a Flight</span>
        <div id="intent-step-dot"></div>
        <span id="intent-step-lbl"></span>
      </div>
      <div id="prototype-listening-prompt" aria-live="polite" aria-atomic="true"></div>

      <div id="stage">
        <div class="drop" id="drop-main">
          <div id="home-glow-layer"></div>
          <div id="prototype-stage-selection" aria-hidden="true">
            <div class="g-stage-selected-refraction">
              <div class="g-stage-selected-blob g-stage-selected-blob--top-left"></div>
              <div class="g-stage-selected-blob g-stage-selected-blob--bottom-right"></div>
            </div>
            <div class="g-stage-selected-sharp-pass">
              <div class="g-stage-selected-sharp-highlight"></div>
            </div>
            <div class="g-stage-selected-accent-rim"></div>
            <div class="g-stage-selected-highlight-mask">
              <div class="g-stage-selected-highlight-mask-image"></div>
            </div>
          </div>
          <div id="c-thumb"><span id="c-thumb-label"></span><img id="c-thumb-img" alt=""/></div>
          <div id="c-primary"></div>
          <div id="c-secondary"></div>
          <div id="c-divider"></div>
          <div id="c-detail"></div>
          <img id="c-media" alt=""/>
          <div id="c-rich"></div>
          <div id="siri-orb"></div>
          <div id="prototype-thinking-stream" class="hidden" aria-hidden="true">
            <span id="prototype-thinking-stream-text"></span>
          </div>
        </div>
        <div class="drop" id="drop-left"></div>
        <div class="drop" id="drop-right"></div>
        <div id="action-card-actions" aria-hidden="true">
          <button class="action-card-button action-card-button-secondary" type="button" tabindex="-1">Snooze</button>
          <button class="action-card-button action-card-button-primary" type="button" tabindex="-1">Join now →</button>
        </div>
        <div id="list-pills"></div>
      </div>
    </div>
    <div id="prototype-figma-button-demo-group" aria-hidden="true" style="display:none">
      <div
        id="prototype-figma-button-demo"
        class="prototype-figma-button-demo"
        data-static-accents="true"
        style="
          --prototype-figma-demo-highlight-blur: 12px;
          --prototype-figma-button-accent-a: rgb(50 117 246);
          --prototype-figma-button-accent-b: rgb(82 34 216);
        "
      >
        <div class="prototype-figma-button-shell">
          <div class="prototype-figma-button-refraction">
            <div class="prototype-figma-button-refraction-filled-mask">
              <div class="prototype-figma-button-refraction-blur prototype-figma-button-refraction-blur-right">
                <div class="prototype-figma-button-refraction-blur-image-wrap">
                  <img
                    class="prototype-figma-button-refraction-blur-image"
                    src="./src/assets/figma-proto-button-refraction-fill.svg"
                    alt=""
                  />
                </div>
              </div>
              <div class="prototype-figma-button-refraction-blur prototype-figma-button-refraction-blur-left">
                <div class="prototype-figma-button-refraction-blur-image-wrap">
                  <img
                    class="prototype-figma-button-refraction-blur-image"
                    src="./src/assets/figma-proto-button-refraction-fill.svg"
                    alt=""
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="prototype-figma-button-refraction-pass prototype-figma-button-refraction-pass-sharp">
            <div class="prototype-figma-button-sharp-highlight"></div>
          </div>
          <div class="prototype-figma-button-accent-rim"></div>
          <div class="prototype-figma-button-highlight"></div>
          <div class="prototype-figma-button-label">Start</div>
          <div class="prototype-figma-button-highlight-mask">
            <div class="prototype-figma-button-highlight-mask-image" aria-hidden="true"></div>
          </div>
        </div>
      </div>
      <div
        id="prototype-figma-square-demo"
        class="prototype-figma-button-demo is-square"
        data-static-accents="true"
        style="
          --prototype-figma-button-accent-a: rgb(50 117 246);
          --prototype-figma-button-accent-b: rgb(82 34 216);
        "
      >
        <div class="prototype-figma-button-shell">
          <div class="prototype-figma-button-refraction">
            <div class="prototype-figma-button-refraction-filled-mask">
              <div class="prototype-figma-button-refraction-blur prototype-figma-button-refraction-blur-right">
                <div class="prototype-figma-button-refraction-blur-image-wrap">
                  <img
                    class="prototype-figma-button-refraction-blur-image"
                    src="./src/assets/figma-proto-button-refraction-fill.svg"
                    alt=""
                  />
                </div>
              </div>
              <div class="prototype-figma-button-refraction-blur prototype-figma-button-refraction-blur-left">
                <div class="prototype-figma-button-refraction-blur-image-wrap">
                  <img
                    class="prototype-figma-button-refraction-blur-image"
                    src="./src/assets/figma-proto-button-refraction-fill.svg"
                    alt=""
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="prototype-figma-button-refraction-pass prototype-figma-button-refraction-pass-sharp">
            <div class="prototype-figma-button-sharp-highlight"></div>
          </div>
          <div class="prototype-figma-button-accent-rim"></div>
          <div class="prototype-figma-button-highlight"></div>
          <div class="prototype-figma-button-highlight-mask">
            <div class="prototype-figma-button-highlight-mask-image" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <input id="user-input" type="text" autocomplete="off" spellcheck="false"
        placeholder="What's the weather? · Book a flight · Send a message…"/>
      <button id="send-btn" onclick="handleSend()">↑</button>
    </div>
    <div id="example-chips">
      <button class="ex-chip" onclick="fireChip(this)">What's the weather?</button>
      <button class="ex-chip" onclick="fireChip(this)">Book a flight to Tokyo</button>
      <button class="ex-chip" onclick="fireChip(this)">Send a message to Alice</button>
      <button class="ex-chip" onclick="fireChip(this)">Set a 10 min timer</button>
      <button class="ex-chip" onclick="fireChip(this)">Call Mom</button>
    </div>
  </div>
</div>

<div id="sidebar">

  <!-- Tab bar -->
  <div class="sb-tabs mode-manual-only" id="sb-tab-bar">
    <button class="sb-tab active" data-tab="stage" type="button">Stage</button>
    <button class="sb-tab" data-tab="content" type="button">Content</button>
    <button class="sb-tab" data-tab="style" type="button">Style</button>
  </div>

  <!-- ── Stage tab ── -->
  <div class="sb-tab-panel mode-manual-only" data-panel="stage">
    <div class="sb-stage-rail">
      <div class="sb-stage-strip">
        <span class="sb-lbl">Stages</span>
        <div class="sb-stage-strip-note">Double-click to rename</div>
      </div>
      <div class="stage-timeline" id="scenario-shape-row"></div>
    </div>

    <div class="sb-btn-row stage-actions">
      <div class="stage-add-group">
        <select id="stage-add-kind" class="sb-select" aria-label="New stage type">
          <option value="dot">Dot</option>
          <option value="list-pill">List-Pill</option>
          <option value="nudge">Nudge</option>
          <option value="pill">Pill</option>
          <option value="card" selected>Card</option>
          <option value="blank">Blank</option>
        </select>
        <button id="stage-add" class="sb-mini-btn" type="button">Add</button>
      </div>
      <button id="stage-duplicate" class="sb-mini-btn icon-btn" type="button" title="Duplicate stage" aria-label="Duplicate stage">⧉</button>
      <button id="stage-delete" class="sb-mini-btn icon-btn" type="button" title="Delete stage" aria-label="Delete stage">🗑</button>
    </div>

    <div id="stage-config-panel" class="sb-stage-config">
      <div id="stage-components-panel" class="sb-row tight hidden">
        <div class="sb-stage-group-head">
          <span class="sb-lbl">Components</span>
        </div>
        <div id="stage-component-controls"></div>
      </div>
      <div id="phone-scene-visible-row" class="sb-row tight hidden">
        <label class="sb-toggle" for="phone-bg-visible-toggle">
          <div class="sb-toggle-copy"><strong>Phone scene visible</strong></div>
          <input id="phone-bg-visible-toggle" class="sb-toggle-input" type="checkbox" checked/>
        </label>
      </div>
    </div>

    <div class="sb-section" data-collapsible="1">
      <button class="sb-section-toggle" type="button">
        <div class="sb-heading">AI Debug</div>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="legacy-grid prototype-ai-debug-grid">
          <button class="sb-shape-btn" data-shape="listening" type="button" onclick="manualShape('listening')">Listening</button>
          <button class="sb-shape-btn" data-shape="magic" type="button" onclick="manualShape('magic')">Thinking</button>
        </div>
        <div id="prototype-multi-agent-row" class="sb-row tight prototype-ai-icon-row hidden">
          <span class="sb-lbl">Multi Agent</span>
          <div class="prototype-ai-icon-grid" role="group" aria-label="Multi Agent">
            <button class="sb-shape-btn sb-ai-icon-btn" data-ai-orb-icon="bixby" type="button">
              <span class="sb-ai-icon-btn__thumb"><img class="sb-ai-icon-btn__thumb-image" src="assets/Bixby.png" alt="Bixby"/></span>
              <span class="sb-ai-icon-btn__label">Bixby</span>
            </button>
            <button class="sb-shape-btn sb-ai-icon-btn" data-ai-orb-icon="gemini" type="button">
              <span class="sb-ai-icon-btn__thumb"><img class="sb-ai-icon-btn__thumb-image" src="src/assets/figma-gemini.png" alt="Gemini"/></span>
              <span class="sb-ai-icon-btn__label">Gemini</span>
            </button>
            <button class="sb-shape-btn sb-ai-icon-btn" data-ai-orb-icon="chatgpt" type="button">
              <span class="sb-ai-icon-btn__thumb"><img class="sb-ai-icon-btn__thumb-image" src="src/assets/figma-chatgpt.png" alt="ChatGPT"/></span>
              <span class="sb-ai-icon-btn__label">ChatGPT</span>
            </button>
          </div>
        </div>
        <div id="prototype-thinking-state-row" class="sb-row tight prototype-thinking-state-row hidden">
          <span class="sb-lbl">Thinking State</span>
          <div class="prototype-thinking-state-grid" role="group" aria-label="Thinking state">
            <button class="sb-shape-btn prototype-thinking-state-btn" data-thinking-state="thinking" type="button">thinking</button>
            <button class="sb-shape-btn prototype-thinking-state-btn" data-thinking-state="skill" type="button">domain</button>
            <button class="sb-shape-btn prototype-thinking-state-btn" data-thinking-state="agent" type="button">agent</button>
            <button class="sb-shape-btn prototype-thinking-state-btn" data-thinking-state="app" type="button">app</button>
          </div>
        </div>
        <div id="prototype-thinking-pause-row" class="sb-row tight prototype-thinking-pause-row hidden">
          <span class="sb-lbl">Playback</span>
          <div class="prototype-thinking-pause-controls" role="group" aria-label="Thinking playback">
            <button id="prototype-thinking-pause" class="sb-mini-btn prototype-thinking-pause-btn" type="button">Pause</button>
            <button id="prototype-thinking-resume" class="sb-mini-btn prototype-thinking-resume-btn" type="button" disabled>Resume</button>
          </div>
        </div>
        <div id="prototype-thinking-copy-row" class="sb-row tight prototype-thinking-copy-row hidden">
          <span class="sb-lbl">Custom Text</span>
          <div class="prototype-thinking-copy-controls">
            <input id="prototype-thinking-copy-input" class="sb-input prototype-thinking-copy-input" type="text" autocomplete="off" spellcheck="false" placeholder="Type custom thinking text"/>
            <button id="prototype-thinking-copy-fire" class="sb-mini-btn prototype-thinking-copy-fire" type="button" disabled>Fire</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Content tab ── -->
  <div class="sb-tab-panel sb-tab-panel-hidden mode-manual-only" data-panel="content">

    <!-- Icon layer row -->
    <div id="editor-icon-layer" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Icon</span>
        <span class="layer-row-preview">
          <span id="layer-preview-icon-text" class="layer-preview-val"></span>
          <span id="layer-preview-icon-size" class="layer-preview-size"></span>
          <span id="layer-preview-icon-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <div class="icon-upload-row">
          <input id="scenario-icon-input" class="sb-input" type="text" maxlength="4" autocomplete="off" spellcheck="false" placeholder="Emoji or glyph"/>
          <label class="sb-mini-btn upload-btn" for="scenario-icon-upload">PNG<input id="scenario-icon-upload" type="file" accept="image/png,image/gif"/></label>
          <button id="scenario-icon-reset" class="sb-mini-btn" type="button">×</button>
        </div>
        <div id="scenario-icon-mode" class="icon-mode-badge">emoji</div>
        <div class="typo-controls">
          <input id="scenario-icon-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Icon size"/>
          <input id="scenario-icon-color" class="typo-color" type="color" value="#ffffff"/>
        </div>
      </div>
    </div>

    <div id="editor-list-items" class="layer-row editor-field hidden">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">List Items</span>
        <span class="layer-row-preview">
          <span id="layer-preview-list-items-count" class="layer-preview-val">3 chips</span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <div id="scenario-list-items-editor" class="sb-row tight"></div>
      </div>
    </div>

    <!-- Primary layer row -->
    <div id="editor-primary-field" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Primary</span>
        <span class="layer-row-preview">
          <span id="layer-preview-primary-text" class="layer-preview-val"></span>
          <span id="layer-preview-primary-size" class="layer-preview-size"></span>
          <span id="layer-preview-primary-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-primary" class="sb-input" type="text" autocomplete="off" spellcheck="false"/>
        <div class="typo-controls">
          <input id="scenario-primary-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-primary-color" class="typo-color" type="color" value="#ffffff"/>
        </div>
      </div>
    </div>

    <!-- Secondary layer row -->
    <div id="editor-secondary-field" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Secondary</span>
        <span class="layer-row-preview">
          <span id="layer-preview-secondary-text" class="layer-preview-val"></span>
          <span id="layer-preview-secondary-size" class="layer-preview-size"></span>
          <span id="layer-preview-secondary-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-secondary" class="sb-input" type="text" autocomplete="off" spellcheck="false"/>
        <div class="typo-controls">
          <input id="scenario-secondary-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-secondary-color" class="typo-color" type="color" value="#8a8a8a"/>
        </div>
      </div>
    </div>

    <!-- Detail layer row -->
    <div id="editor-detail-field" class="layer-row editor-field">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Detail</span>
        <span class="layer-row-preview">
          <span id="layer-preview-detail-text" class="layer-preview-val"></span>
          <span id="layer-preview-detail-size" class="layer-preview-size"></span>
          <span id="layer-preview-detail-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <textarea id="scenario-detail" class="sb-textarea" rows="4" autocomplete="off" spellcheck="false" placeholder="Detail text"></textarea>
        <div class="typo-controls">
          <input id="scenario-detail-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-detail-color" class="typo-color" type="color" value="#5a5a5a"/>
        </div>
      </div>
    </div>

    <div id="editor-action-card-field" class="layer-row editor-field hidden">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Actions</span>
        <span class="layer-row-preview">
          <span id="layer-preview-action-card-text" class="layer-preview-val"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-action-card-left" class="sb-input" type="text" autocomplete="off" spellcheck="false" placeholder="Left action"/>
        <input id="scenario-action-card-right" class="sb-input" type="text" autocomplete="off" spellcheck="false" placeholder="Right action"/>
      </div>
    </div>

    <div id="editor-intent-header-field" class="layer-row editor-field hidden">
      <button class="layer-row-header" type="button">
        <span class="layer-row-label">Intent Header</span>
        <span class="layer-row-preview">
          <span id="layer-preview-intent-header-text" class="layer-preview-val"></span>
          <span id="layer-preview-intent-header-size" class="layer-preview-size"></span>
          <span id="layer-preview-intent-header-color" class="layer-preview-dot"></span>
        </span>
        <span class="layer-row-chevron">▾</span>
      </button>
      <div class="layer-row-body">
        <input id="scenario-intent-header" class="sb-input" type="text" autocomplete="off" spellcheck="false" placeholder="Intent header text"/>
        <div class="typo-controls">
          <input id="scenario-intent-header-size" class="sb-input typo-size" type="text" inputmode="numeric" placeholder="Size"/>
          <input id="scenario-intent-header-color" class="typo-color" type="color" value="#a0a0a0"/>
        </div>
      </div>
    </div>

    <!-- Media -->
    <div id="editor-media-field" class="sb-row tight editor-field hidden">
      <label class="sb-lbl">Card image(s)</label>
      <div id="scenario-media-list" class="media-list"></div>
    </div>

  </div>

  <!-- ── Style tab ── -->
  <div class="sb-tab-panel sb-tab-panel-hidden mode-manual-only" data-panel="style">
    <div class="sb-row tight">
      <label class="sb-toggle" for="stage-selected-toggle">
        <div class="sb-toggle-copy"><strong>Selected</strong></div>
        <input id="stage-selected-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
    </div>
    <div class="sb-row tight">
      <label class="sb-toggle" for="stage-shell-hidden-toggle">
        <div class="sb-toggle-copy"><strong>Hide shell</strong></div>
        <input id="stage-shell-hidden-toggle" class="sb-toggle-input" type="checkbox"/>
      </label>
    </div>

    <div id="stage-geometry-section" class="sb-section" data-collapsible="1">
      <button class="sb-section-toggle" type="button">
        <div class="sb-heading">Geometry</div>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="sb-geometry-controls">
          <div class="sb-row">
            <div class="sb-range-head">
              <label class="sb-lbl" for="stage-radius-input">Corner radius</label>
              <span class="sb-val" id="stage-radius-val">30px</span>
            </div>
            <input id="stage-radius-input" type="range" min="0" max="100" step="10" value="30"/>
          </div>
          <div class="sb-row">
            <div class="sb-range-head">
              <label class="sb-lbl" for="stage-width-input">Width</label>
              <span class="sb-val" id="stage-width-val">420px</span>
            </div>
            <input id="stage-width-input" type="range" min="40" max="420" step="10" value="420"/>
          </div>
          <div class="sb-row">
            <div class="sb-range-head">
              <label class="sb-lbl" for="stage-height-input">Height</label>
              <span class="sb-val" id="stage-height-val">120px</span>
            </div>
            <input id="stage-height-input" type="range" min="40" max="420" step="10" value="120"/>
          </div>
          <div id="stage-image-padding-field" class="sb-row hidden">
            <div class="sb-range-head">
              <label class="sb-lbl" for="stage-image-padding-input">Image padding</label>
              <span class="sb-val" id="stage-image-padding-val">24px</span>
            </div>
            <input id="stage-image-padding-input" type="range" min="0" max="30" step="1" value="24"/>
          </div>
          <div class="sb-row">
            <div class="sb-range-head">
              <label class="sb-lbl" for="stage-icon-pad-input">Icon left pad</label>
              <span class="sb-val" id="stage-icon-pad-val">16px</span>
            </div>
            <input id="stage-icon-pad-input" type="range" min="0" max="30" step="1" value="16"/>
          </div>
          <div class="sb-row">
            <div class="sb-range-head">
              <label class="sb-lbl" for="stage-gap-input">Icon gap</label>
              <span class="sb-val" id="stage-gap-val">8px</span>
            </div>
            <input id="stage-gap-input" type="range" min="0" max="30" step="1" value="8"/>
          </div>
        </div>
        <div id="stage-card-s-row" class="sb-row tight hidden">
          <label class="sb-toggle" for="stage-card-s-toggle">
            <div class="sb-toggle-copy"><strong>Card-S layout</strong></div>
            <input id="stage-card-s-toggle" class="sb-toggle-input" type="checkbox"/>
          </label>
        </div>
        <div id="stage-list-count-row" class="sb-row tight hidden">
          <label class="sb-lbl">List chips</label>
          <div class="sb-btn-row">
            <button id="stage-list-count-dec" class="sb-mini-btn" type="button">−</button>
            <div id="stage-list-count-val" class="sb-input" style="text-align:center;pointer-events:none;">3</div>
            <button id="stage-list-count-inc" class="sb-mini-btn" type="button">+</button>
          </div>
        </div>
        <div id="stage-list-listening-orb-row" class="sb-row tight hidden">
          <label class="sb-toggle" for="stage-list-listening-orb-toggle">
            <div class="sb-toggle-copy"><strong>Bottom circle</strong></div>
            <input id="stage-list-listening-orb-toggle" class="sb-toggle-input" type="checkbox"/>
          </label>
        </div>
      </div>
    </div>

    <div id="stage-celestial-style-section" class="sb-section hidden" data-collapsible="1">
      <button class="sb-section-toggle" type="button">
        <div class="sb-heading">Celestial Style</div>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="sb-stage-group">
          <div class="sb-stage-group-head">
            <span class="sb-lbl">Accent blobs</span>
          </div>
          <div class="sb-stage-grid sb-style-color-grid">
            <div class="sb-stage-field">
              <label class="sb-lbl" for="stage-blob-top-core-color">Top-left core</label>
              <input id="stage-blob-top-core-color" class="typo-color" type="color" value="#90acff"/>
            </div>
            <div class="sb-stage-field">
              <label class="sb-lbl" for="stage-blob-top-edge-color">Top-left edge</label>
              <input id="stage-blob-top-edge-color" class="typo-color" type="color" value="#9761ff"/>
            </div>
            <div class="sb-stage-field">
              <label class="sb-lbl" for="stage-blob-bottom-core-color">Bottom-right core</label>
              <input id="stage-blob-bottom-core-color" class="typo-color" type="color" value="#90acff"/>
            </div>
            <div class="sb-stage-field">
              <label class="sb-lbl" for="stage-blob-bottom-edge-color">Bottom-right edge</label>
              <input id="stage-blob-bottom-edge-color" class="typo-color" type="color" value="#9761ff"/>
            </div>
          </div>
        </div>

        <div class="sb-stage-group">
          <div class="sb-stage-group-head">
            <span class="sb-lbl">Refraction mask</span>
          </div>
          <div class="sb-geometry-controls">
            <div class="sb-row">
              <div class="sb-range-head">
                <label class="sb-lbl" for="stage-mask-blur-input">Mask blur</label>
                <span class="sb-val" id="stage-mask-blur-val">30px</span>
              </div>
              <input id="stage-mask-blur-input" type="range" min="0" max="30" step="0.5" value="30"/>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="sb-section" data-collapsible="1">
      <button class="sb-section-toggle" type="button">
        <div class="sb-heading">Animation</div>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="sb-row">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <span class="sb-lbl">Duration</span>
            <span class="sb-val" id="dur-val">450ms</span>
          </div>
          <input type="range" id="dur-sl" min="100" max="1400" step="50" value="450"/>
        </div>
        <div class="sb-row">
          <span class="sb-lbl">Easing</span>
          <select id="ease-select">
            <option value="custom" selected>Custom bezier</option>
            <option value="spring">Liquid feeling</option>
            <option value="ease">Ease</option>
            <option value="linear">Linear</option>
          </select>
        </div>
        <div class="sb-row" id="bz-group">
          <span class="sb-lbl">Bezier</span>
          <div id="bz-row">
            <input class="bz-inp" id="bz-input" type="text" value="0.35, 0.23, 0.13, 0.98" autocomplete="off" spellcheck="false" placeholder="0.2, 0.2, 0.1, 1"/>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="src/shared/modern-screenshot.min.js"></script>
<script type="module" src="src/tool/index-app.js"></script>
</body>
</html>
