<svg width="140" height="56" viewBox="0 0 140 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="140" height="56" rx="28" fill="white"/>
  <g filter="url(#center_blur)">
    <rect x="14" y="10" width="112" height="36" rx="18" fill="black"/>
  </g>
  <defs>
    <filter id="center_blur" x="0" y="0" width="140" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
